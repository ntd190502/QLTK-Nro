name: Auto Quest Branch Build

on:
  push:
    branches:
      - feature/auto-quest-learning-1-7
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  OFFICIAL_NRO_PC_URL: https://dl.teamobi.com/drive/get/jp

jobs:
  build-manager:
    name: Build QLTK Manager (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Auto Quest branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore manager
        run: dotnet restore "QLTK Nro Pro/QLTK Nro Pro.csproj"

      - name: Build manager
        run: dotnet build "QLTK Nro Pro/QLTK Nro Pro.csproj" -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish "QLTK Nro Pro/QLTK Nro Pro.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "artifacts/QLTK-Manager"

      - name: Upload manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Manager-${{ github.run_number }}
          path: artifacts/QLTK-Manager/
          if-no-files-found: error
          retention-days: 14

  build-mod:
    name: Build Auto Quest Assembly-CSharp
    runs-on: windows-latest

    steps:
      - name: Checkout Auto Quest branch
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore mod compiler project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet restore "Mod Nro Pc/ModNroPc.csproj" 2>&1 | Tee-Object -FilePath "artifacts/mod-restore.log"

      - name: Compile Assembly-CSharp
        id: compile_mod
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build "Mod Nro Pc/ModNroPc.csproj" -c Release --no-restore 2>&1 | Tee-Object -FilePath "artifacts/mod-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect mod output
        if: steps.compile_mod.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/AutoQuest-Mod" | Out-Null
          $dll = Get-ChildItem -Path "Mod Nro Pc/bin/Release" -Recurse -Filter "Assembly-CSharp.dll" | Select-Object -First 1
          if (-not $dll) { throw "Assembly-CSharp.dll was not produced" }
          Copy-Item $dll.FullName "artifacts/AutoQuest-Mod/Assembly-CSharp.dll"
          if (Test-Path ($dll.FullName.Replace('.dll','.pdb'))) {
            Copy-Item ($dll.FullName.Replace('.dll','.pdb')) "artifacts/AutoQuest-Mod/Assembly-CSharp.pdb"
          }
          @"
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Built: $(Get-Date -Format o)
          Output: Assembly-CSharp.dll
          Purpose: replacement managed game assembly containing Auto Quest learning code.
          "@ | Set-Content -Encoding UTF8 "artifacts/AutoQuest-Mod/BUILD-INFO.txt"

      - name: Upload compiled mod
        if: steps.compile_mod.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Assembly-CSharp-${{ github.run_number }}
          path: artifacts/AutoQuest-Mod/
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Compile-Logs-${{ github.run_number }}
          path: |
            artifacts/mod-restore.log
            artifacts/mod-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if mod did not compile
        if: steps.compile_mod.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "Mod compilation failed. See AutoQuest-Compile-Logs artifact for exact missing/incompatible references."
          exit 1

  package-full-client:
    name: Package full NRO Auto Quest client
    needs: [build-mod]
    runs-on: windows-latest

    steps:
      - name: Download Auto Quest assembly
        uses: actions/download-artifact@v4
        with:
          name: AutoQuest-Assembly-CSharp-${{ github.run_number }}
          path: mod

      - name: Download official NRO PC client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work, diagnostics | Out-Null
          $out = Join-Path $PWD 'work/client-download.bin'
          Write-Host "Downloading official PC client from $env:OFFICIAL_NRO_PC_URL"
          $headers = @{ 'User-Agent' = 'Mozilla/5.0 GitHub-Actions AutoQuest-Test-Builder' }
          Invoke-WebRequest -Uri $env:OFFICIAL_NRO_PC_URL -Headers $headers -MaximumRedirection 10 -OutFile $out
          if (-not (Test-Path $out)) { throw 'Official client download did not create a file.' }
          $size = (Get-Item $out).Length
          if ($size -lt 1MB) {
            Get-Content $out -Raw -ErrorAction SilentlyContinue | Set-Content -Encoding UTF8 diagnostics/download-response.txt
            throw "Official client download is unexpectedly small: $size bytes"
          }
          Write-Host "Downloaded $size bytes"
          Get-FileHash $out -Algorithm SHA256 | Format-List | Out-File diagnostics/client-download-sha256.txt

      - name: Extract official client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD 'work/client-download.bin'
          $dest = Join-Path $PWD 'work/extracted'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # 7-Zip is preinstalled on windows-latest and handles ZIP/7z/RAR and many SFX EXEs.
          & 7z x $src "-o$dest" -y | Tee-Object -FilePath diagnostics/7zip-extract.log
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed to extract official client (exit $LASTEXITCODE)." }

          $files = Get-ChildItem $dest -Recurse -File
          "Extracted files: $($files.Count)" | Out-File diagnostics/extracted-summary.txt
          $files | Select-Object FullName, Length | Format-Table -AutoSize | Out-File diagnostics/extracted-files.txt -Width 300

      - name: Locate Unity client and patch Auto Quest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $PWD 'work/extracted'
          $modDll = Join-Path $PWD 'mod/Assembly-CSharp.dll'
          if (-not (Test-Path $modDll)) { throw 'Compiled Auto Quest Assembly-CSharp.dll is missing.' }

          $target = Get-ChildItem $extract -Recurse -File -Filter 'Assembly-CSharp.dll' |
            Where-Object { $_.DirectoryName -match '[\\/]Managed$' } |
            Select-Object -First 1
          if (-not $target) {
            throw 'Downloaded PC package does not contain a Unity Managed/Assembly-CSharp.dll. It is not compatible with this mod build.'
          }

          $dataDir = $target.Directory.Parent
          $clientRoot = $dataDir.Parent.FullName
          Write-Host "Detected client root: $clientRoot"
          Write-Host "Detected managed DLL: $($target.FullName)"

          $exe = Get-ChildItem $clientRoot -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch '^(UnityCrashHandler|crashpad_handler)' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "No game EXE found next to detected *_Data directory: $clientRoot" }

          $originalHash = (Get-FileHash $target.FullName -Algorithm SHA256).Hash
          $modHash = (Get-FileHash $modDll -Algorithm SHA256).Hash
          Copy-Item $target.FullName "$($target.FullName).original.bak" -Force
          Copy-Item $modDll $target.FullName -Force
          $patchedHash = (Get-FileHash $target.FullName -Algorithm SHA256).Hash
          if ($patchedHash -ne $modHash) { throw 'Patched Assembly-CSharp.dll hash does not match compiled mod DLL.' }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item (Join-Path $clientRoot '*') package -Recurse -Force

          $gameExe = Get-ChildItem package -File -Filter $exe.Name | Select-Object -First 1
          if (-not $gameExe) { throw 'Game EXE was lost while creating package.' }

          @"
          AUTO QUEST 1-7 - FULL CLIENT TEST

          CACH TEST:
          1. Giai nen toan bo artifact ZIP.
          2. Mo file game EXE: $($exe.Name)
          3. Dang nhap tai khoan dang o nhiem vu dau de Auto Quest hoc va chay.

          FILE TU HOC (sau khi game chay):
          Data\AutoQuest\quest_profiles.json
          Data\AutoQuest\quest_learning.log

          THONG TIN BUILD:
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_RUN_NUMBER
          Official client source: $env:OFFICIAL_NRO_PC_URL
          Original Assembly SHA256: $originalHash
          AutoQuest Assembly SHA256: $modHash
          Game EXE: $($exe.Name)
          "@ | Set-Content -Encoding UTF8 package/README-AUTOQUEST.txt

          @"
          game_exe=$($exe.Name)
          original_assembly_sha256=$originalHash
          autoquest_assembly_sha256=$modHash
          "@ | Set-Content -Encoding UTF8 diagnostics/package-info.txt

      - name: Validate full client package
        shell: pwsh
        run: |
          $dll = Get-ChildItem package -Recurse -File -Filter 'Assembly-CSharp.dll' | Where-Object { $_.DirectoryName -match '[\\/]Managed$' } | Select-Object -First 1
          if (-not $dll) { throw 'Final package has no Managed/Assembly-CSharp.dll.' }
          $exe = Get-ChildItem package -File -Filter '*.exe' | Where-Object { $_.Name -notmatch '^(UnityCrashHandler|crashpad_handler)' } | Select-Object -First 1
          if (-not $exe) { throw 'Final package has no runnable game EXE.' }
          $modHash = (Get-FileHash 'mod/Assembly-CSharp.dll' -Algorithm SHA256).Hash
          $pkgHash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
          if ($modHash -ne $pkgHash) { throw 'Final package contains wrong Assembly-CSharp.dll.' }
          Write-Host "FULL CLIENT READY: $($exe.Name)"

      - name: Upload full ready-to-run client
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-FULL-CLIENT-${{ github.run_number }}
          path: package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload full-client diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-FULL-CLIENT-Diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  package-test:
    name: Package QLTK-assisted Auto Quest test ZIP
    needs: [build-manager, build-mod]
    runs-on: windows-latest

    steps:
      - name: Download manager artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoQuest-Manager-${{ github.run_number }}
          path: package/Manager

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoQuest-Assembly-CSharp-${{ github.run_number }}
          path: package/AutoQuest-Mod

      - name: Create fallback launcher
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          title NRO Auto Quest 1-7 Test
          cd /d "%~dp0"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0Start-AutoQuest.ps1"
          if errorlevel 1 (
            echo.
            echo Auto Quest launcher reported an error.
            pause
          )
          '@ | Set-Content -Encoding ASCII "package/START-AUTOQUEST.bat"

          @'
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $managerDir = Join-Path $root 'Manager'
          $modDll = Join-Path $root 'AutoQuest-Mod\Assembly-CSharp.dll'
          $clientRoot = Join-Path $env:TEMP 'cuongle4399\mod 244'
          $logDir = Join-Path $root 'Test-Logs'
          $launcherLog = Join-Path $logDir 'launcher.log'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          function Log([string]$text) {
            $line = "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $text"
            $line | Tee-Object -FilePath $launcherLog -Append
          }

          if (-not (Test-Path $modDll)) { throw "Missing AutoQuest-Mod\Assembly-CSharp.dll" }
          $managerExe = Get-ChildItem -Path $managerDir -Filter '*.exe' -File | Where-Object { $_.Name -notmatch '^(createdump|Update)\.exe$' } | Select-Object -First 1
          if (-not $managerExe) { throw 'QLTK Manager EXE was not found in package.' }

          function Patch-ClientAssemblies {
            if (-not (Test-Path $clientRoot)) { return 0 }
            $targets = @(Get-ChildItem -Path $clientRoot -Filter 'Assembly-CSharp.dll' -File -Recurse -ErrorAction SilentlyContinue)
            $patched = 0
            foreach ($target in $targets) {
              try {
                $backup = "$($target.FullName).autoquest-original.bak"
                if (-not (Test-Path $backup)) { Copy-Item $target.FullName $backup -Force }
                $srcHash = (Get-FileHash $modDll -Algorithm SHA256).Hash
                $dstHash = (Get-FileHash $target.FullName -Algorithm SHA256).Hash
                if ($srcHash -ne $dstHash) { Copy-Item $modDll $target.FullName -Force }
                $patched++
              } catch { Log "Patch retry: $($_.Exception.Message)" }
            }
            return $patched
          }

          Patch-ClientAssemblies | Out-Null
          Start-Process -FilePath $managerExe.FullName -WorkingDirectory $managerDir
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) { Patch-ClientAssemblies | Out-Null; Start-Sleep -Milliseconds 500 }
          '@ | Set-Content -Encoding UTF8 "package/Start-AutoQuest.ps1"

      - name: Upload fallback package
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-QLTK-FALLBACK-${{ github.run_number }}
          path: package/
          if-no-files-found: error
          retention-days: 14
