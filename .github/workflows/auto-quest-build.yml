name: Auto Quest Branch Build

on:
  push:
    branches:
      - feature/auto-quest-learning-1-7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    name: Build QLTK Manager (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Auto Quest branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "QLTK Nro Pro/QLTK Nro Pro.csproj"

      - name: Build
        run: dotnet build "QLTK Nro Pro/QLTK Nro Pro.csproj" -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish "QLTK Nro Pro/QLTK Nro Pro.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "artifacts/QLTK-Manager"

      - name: Include Auto Quest learning source and build info
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/AutoQuest-Source" | Out-Null
          Copy-Item "Mod Nro Pc/Mod.CuongLe/AutoQuestCL.cs" "artifacts/AutoQuest-Source/AutoQuestCL.cs"
          Copy-Item "Mod Nro Pc/Mod.CuongLe/QuestLearningStore.cs" "artifacts/AutoQuest-Source/QuestLearningStore.cs"
          Copy-Item "Mod Nro Pc/Mod.CuongLe/NhapCodeLive.cs" "artifacts/AutoQuest-Source/NhapCodeLive.cs"
          @"
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Built: $(Get-Date -Format o)

          IMPORTANT:
          QLTK Nro Pro is a normal .NET 8 WinForms project and is built into QLTK-Manager.
          The repository's 'Mod Nro Pc' folder is decompiled Unity/Assembly-CSharp source and currently has no .csproj/Unity project or referenced Unity managed DLL set in this repository.
          Therefore GitHub Actions cannot yet produce a trustworthy modified NRO game executable from those source files alone.
          The AutoQuest source is included separately in this artifact until a reproducible Mod Nro Pc build project is added.
          "@ | Set-Content -Encoding UTF8 "artifacts/BUILD-INFO.txt"

      - name: Upload branch artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Branch-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
