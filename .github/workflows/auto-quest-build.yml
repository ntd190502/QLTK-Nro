name: Auto Quest Branch Build

on:
  push:
    branches:
      - feature/auto-quest-learning-1-7
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    name: Build QLTK Manager (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Auto Quest branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore manager
        run: dotnet restore "QLTK Nro Pro/QLTK Nro Pro.csproj"

      - name: Build manager
        run: dotnet build "QLTK Nro Pro/QLTK Nro Pro.csproj" -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish "QLTK Nro Pro/QLTK Nro Pro.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "artifacts/QLTK-Manager"

      - name: Upload manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Manager-${{ github.run_number }}
          path: artifacts/QLTK-Manager/
          if-no-files-found: error
          retention-days: 14

  build-mod:
    name: Build Auto Quest Assembly-CSharp
    runs-on: windows-latest

    steps:
      - name: Checkout Auto Quest branch
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore mod compiler project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet restore "Mod Nro Pc/ModNroPc.csproj" 2>&1 | Tee-Object -FilePath "artifacts/mod-restore.log"

      - name: Compile Assembly-CSharp
        id: compile_mod
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build "Mod Nro Pc/ModNroPc.csproj" -c Release --no-restore 2>&1 | Tee-Object -FilePath "artifacts/mod-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect mod output
        if: steps.compile_mod.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/AutoQuest-Mod" | Out-Null
          $dll = Get-ChildItem -Path "Mod Nro Pc/bin/Release" -Recurse -Filter "Assembly-CSharp.dll" | Select-Object -First 1
          if (-not $dll) { throw "Assembly-CSharp.dll was not produced" }
          Copy-Item $dll.FullName "artifacts/AutoQuest-Mod/Assembly-CSharp.dll"
          if (Test-Path ($dll.FullName.Replace('.dll','.pdb'))) {
            Copy-Item ($dll.FullName.Replace('.dll','.pdb')) "artifacts/AutoQuest-Mod/Assembly-CSharp.pdb"
          }
          @"
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Built: $(Get-Date -Format o)
          Output: Assembly-CSharp.dll
          Purpose: replacement managed game assembly containing Auto Quest learning code.
          "@ | Set-Content -Encoding UTF8 "artifacts/AutoQuest-Mod/BUILD-INFO.txt"

      - name: Upload compiled mod
        if: steps.compile_mod.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Assembly-CSharp-${{ github.run_number }}
          path: artifacts/AutoQuest-Mod/
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-Compile-Logs-${{ github.run_number }}
          path: |
            artifacts/mod-restore.log
            artifacts/mod-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if mod did not compile
        if: steps.compile_mod.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "Mod compilation failed. See AutoQuest-Compile-Logs artifact for exact missing/incompatible references."
          exit 1

  package-test:
    name: Package one-click Auto Quest test ZIP
    needs: [build-manager, build-mod]
    runs-on: windows-latest

    steps:
      - name: Download manager artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoQuest-Manager-${{ github.run_number }}
          path: package/Manager

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoQuest-Assembly-CSharp-${{ github.run_number }}
          path: package/AutoQuest-Mod

      - name: Create one-click launcher
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          title NRO Auto Quest 1-7 Test
          cd /d "%~dp0"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0Start-AutoQuest.ps1"
          if errorlevel 1 (
            echo.
            echo Auto Quest launcher reported an error.
            pause
          )
          '@ | Set-Content -Encoding ASCII "package/START-AUTOQUEST.bat"

          @'
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $managerDir = Join-Path $root 'Manager'
          $modDll = Join-Path $root 'AutoQuest-Mod\Assembly-CSharp.dll'
          $clientRoot = Join-Path $env:TEMP 'cuongle4399\mod 244'
          $logDir = Join-Path $root 'Test-Logs'
          $launcherLog = Join-Path $logDir 'launcher.log'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          function Log([string]$text) {
            $line = "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $text"
            $line | Tee-Object -FilePath $launcherLog -Append
          }

          if (-not (Test-Path $modDll)) { throw "Missing AutoQuest-Mod\Assembly-CSharp.dll" }

          $managerExe = Get-ChildItem -Path $managerDir -Filter '*.exe' -File | Where-Object { $_.Name -notmatch '^(createdump|Update)\.exe$' } | Select-Object -First 1
          if (-not $managerExe) { throw 'QLTK Manager EXE was not found in package.' }

          function Patch-ClientAssemblies {
            if (-not (Test-Path $clientRoot)) { return 0 }
            $targets = @(Get-ChildItem -Path $clientRoot -Filter 'Assembly-CSharp.dll' -File -Recurse -ErrorAction SilentlyContinue)
            $patched = 0
            foreach ($target in $targets) {
              try {
                $backup = "$($target.FullName).autoquest-original.bak"
                if (-not (Test-Path $backup)) {
                  Copy-Item $target.FullName $backup -Force
                  Log "Backed up original: $backup"
                }
                $srcHash = (Get-FileHash $modDll -Algorithm SHA256).Hash
                $dstHash = (Get-FileHash $target.FullName -Algorithm SHA256).Hash
                if ($srcHash -ne $dstHash) {
                  Copy-Item $modDll $target.FullName -Force
                  Log "Patched Auto Quest DLL: $($target.FullName)"
                }
                $patched++
              } catch {
                Log "Patch retry needed for $($target.FullName): $($_.Exception.Message)"
              }
            }
            return $patched
          }

          Log "Auto Quest one-click launcher started. Client cache: $clientRoot"
          $before = Patch-ClientAssemblies
          if ($before -gt 0) { Log "Found and prepared $before client assembly target(s) before manager start." }

          Log "Starting QLTK Manager: $($managerExe.FullName)"
          Start-Process -FilePath $managerExe.FullName -WorkingDirectory $managerDir

          # The original manager uses %TEMP%\cuongle4399\mod 244. Keep watching so
          # a freshly extracted client is patched automatically without manual DLL replacement.
          $deadline = (Get-Date).AddMinutes(10)
          $everPatched = $before -gt 0
          while ((Get-Date) -lt $deadline) {
            $count = Patch-ClientAssemblies
            if ($count -gt 0) { $everPatched = $true }
            Start-Sleep -Milliseconds 500
          }

          if (-not $everPatched) {
            Log 'No client Assembly-CSharp.dll was found within 10 minutes.'
            Write-Host ''
            Write-Host 'QLTK Manager opened, but its NRO client cache was not created yet.'
            Write-Host 'Open/start one NRO account in QLTK, then run START-AUTOQUEST.bat again.'
            exit 2
          }

          Log 'Auto Quest patch watcher finished successfully.'
          '@ | Set-Content -Encoding UTF8 "package/Start-AutoQuest.ps1"

          @'
          AUTO QUEST 1-7 - TEST PACKAGE

          CACH DUNG:
          1. Giai nen toan bo ZIP.
          2. Bam START-AUTOQUEST.bat.
          3. QLTK Manager se mo. Mo mot tai khoan NRO de test.
          4. Launcher tu dong tim client cua QLTK trong %%TEMP%%\cuongle4399\mod 244
             va thay Assembly-CSharp.dll bang ban Auto Quest.
          5. Ban goc duoc backup thanh Assembly-CSharp.dll.autoquest-original.bak.

          DU LIEU AUTO QUEST:
          Data\AutoQuest\quest_profiles.json
          Data\AutoQuest\quest_learning.log

          Neu lan dau QLTK chua tao client, hay mo/start mot acc roi chay lai START-AUTOQUEST.bat.
          Khong can tu copy DLL.
          '@ | Set-Content -Encoding UTF8 "package/README-TEST.txt"

          @"
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_RUN_NUMBER
          Built: $(Get-Date -Format o)
          "@ | Set-Content -Encoding UTF8 "package/BUILD-INFO.txt"

      - name: Validate package
        shell: pwsh
        run: |
          $required = @(
            'package/START-AUTOQUEST.bat',
            'package/Start-AutoQuest.ps1',
            'package/AutoQuest-Mod/Assembly-CSharp.dll',
            'package/README-TEST.txt'
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Missing package file: $item" }
          }
          $managerExe = Get-ChildItem 'package/Manager' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $managerExe) { throw 'Manager executable missing from final package.' }

      - name: Upload ready-to-test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuest-READY-TO-TEST-${{ github.run_number }}
          path: package/
          if-no-files-found: error
          retention-days: 14
